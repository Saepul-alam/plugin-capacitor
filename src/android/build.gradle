buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:4.2.1'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.5.31'
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    compileSdkVersion project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 30

    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 21
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 30
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    // Capacitor - supplied by the host project
    implementation project(':capacitor-android')

    // CameraX 1.1.x. camera-video (VideoCapture/Recorder) is only available from
    // 1.1.0 onwards. NOTE: this family of artifacts declares minCompileSdk=31, so
    // the host app must compile against android-31 or newer.
    // camera-lifecycle is required for androidx.camera.lifecycle.ProcessCameraProvider
    // (bindToLifecycle / unbindAll); camera-core alone does not provide it.
    implementation "androidx.camera:camera-core:1.1.0"
    implementation "androidx.camera:camera-camera2:1.1.0"
    implementation "androidx.camera:camera-lifecycle:1.1.0"
    implementation "androidx.camera:camera-view:1.1.0"
    implementation "androidx.camera:camera-video:1.1.0"

    // Lifecycle - needed for lifecycle references
    implementation "androidx.lifecycle:lifecycle-process:2.3.1"

    // Location
    implementation "com.google.android.gms:play-services-location:18.0.0"

    // EXIF
    implementation "androidx.exifinterface:exifinterface:1.3.2"

    // UI
    implementation "androidx.appcompat:appcompat:1.3.0"
    // Required by res/layout/activity_camera_verified.xml and activity_barcode_scan.xml,
    // which use androidx.constraintlayout.widget.ConstraintLayout with
    // app:layout_constraint* attributes.
    implementation "androidx.constraintlayout:constraintlayout:2.0.4"

    // androidx.activity:activity (and the ActivityResultContracts /
    // registerForActivityResult API used by CameraVerifiedActivity and
    // BarcodeScanActivity) arrives transitively through appcompat.
    // Do NOT add androidx.activity:activity-ktx:1.3.x here: its AAR metadata declares
    // minCompileSdk=30, which fails :app:checkDebugAarMetadata while the project
    // compiles against android-29.

    // Coroutines - era-appropriate + play-services for Task.await()
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.5.2"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.5.2"

    // Biometric Authentication
    implementation "androidx.biometric:biometric:1.1.0"

    // ML Kit Barcode Scanning
    implementation "com.google.mlkit:barcode-scanning:17.2.0"
}

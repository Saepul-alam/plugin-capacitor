apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

// This module configures itself so the plugin stays portable: cloning the repo and
// running `cap sync` is enough, no edits to the host project's root build.gradle.
//
// Written for Android Gradle Plugin 4.1.3 (the version the Capacitor 2 / Quasar
// Capacitor-mode host uses):
//   * no `namespace` block, AGP 4.x takes the package from AndroidManifest.xml
//   * compileSdkVersion/targetSdkVersion 29, matching the host's variables.gradle
android {
    compileSdkVersion 29

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 29
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    // Capacitor - supplied by the host project
    implementation project(':capacitor-android')

    // CameraX - versions that still compile against compileSdk 29.
    // camera-lifecycle is required for androidx.camera.lifecycle.ProcessCameraProvider
    // (bindToLifecycle / unbindAll); camera-core alone does not provide it.
    implementation "androidx.camera:camera-core:1.0.2"
    implementation "androidx.camera:camera-camera2:1.0.2"
    implementation "androidx.camera:camera-lifecycle:1.0.2"
    implementation "androidx.camera:camera-view:1.0.0-alpha20"

    // Lifecycle - needed for lifecycle references
    implementation "androidx.lifecycle:lifecycle-process:2.3.1"

    // Location
    implementation "com.google.android.gms:play-services-location:18.0.0"

    // EXIF
    implementation "androidx.exifinterface:exifinterface:1.3.2"

    // UI
    implementation "androidx.appcompat:appcompat:1.3.0"

    // androidx.activity:activity (and the ActivityResultContracts /
    // registerForActivityResult API used by CameraVerifiedActivity and
    // BarcodeScanActivity) arrives transitively through appcompat.
    // Do NOT add androidx.activity:activity-ktx:1.3.x here: its AAR metadata declares
    // minCompileSdk=30, which fails :app:checkDebugAarMetadata while the project
    // compiles against android-29.

    // Coroutines - era-appropriate + play-services for Task.await()
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.5.2"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.5.2"

    // Biometric Authentication
    implementation "androidx.biometric:biometric:1.1.0"

    // ML Kit Barcode Scanning
    implementation "com.google.mlkit:barcode-scanning:17.2.0"
}

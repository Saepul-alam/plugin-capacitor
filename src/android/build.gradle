apply plugin: 'com.android.library'

dependencies {
    // Capacitor - use from host project
    implementation project(':capacitor-android')

    // CameraX - use versions compatible with Capacitor 2.5 and AndroidX
    implementation "androidx.camera:camera-core:1.3.0"
    implementation "androidx.camera:camera-camera2:1.3.0"
    implementation "androidx.camera:camera-view:1.3.0"

    // Lifecycle - needed for lifecycle references
    implementation "androidx.lifecycle:lifecycle-process:2.6.1"

    // Location
    implementation "com.google.android.gms:play-services-location:21.0.1"

    // EXIF
    implementation "androidx.exifinterface:exifinterface:1.3.6"

    // UI
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.activity:activity-ktx:1.8.0"

    // Coroutines - newer version for await() and Job.cancel()
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
}

android {
    namespace 'com.al.pluginsecure'
    compileSdkVersion 33

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}